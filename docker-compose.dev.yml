# Docker Compose for Development
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: skillhub-db-dev
    environment:
      POSTGRES_DB: skillhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - skillhub-dev-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: skillhub-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@skillhub.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - skillhub-dev-network

networks:
  skillhub-dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local
